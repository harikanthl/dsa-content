# ─────────────────────────────────────────────────────────────────────────────
#  tmux.conf — tuned for DSA practice + screen recording
#  Learn in this order:  prefix → panes → windows → sessions → copy-mode
# ─────────────────────────────────────────────────────────────────────────────

# Ctrl-a is reachable without contorting your hand. Ctrl-b is not.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on                 # on-camera: scroll + click panes without hotkey noise
set -s escape-time 0            # no delay when you hit <Esc> in nvim
set -g focus-events on          # lets nvim autoread files changed outside
set -g history-limit 50000
set -g base-index 1             # windows start at 1 — matches your number row
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# ── reload ───────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display " reloaded"

# ── panes: split keys you can actually remember ──────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"' ; unbind %

# hjkl to move, HJKL to resize — same muscle memory as nvim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z          # zoom: the single most useful recording key

# ── vi copy-mode (prefix [ to enter, q to leave) ─────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ── sessions: fzf switcher, the tmux superpower ──────────────────────────────
bind s choose-tree -Zs
bind S display-popup -E -w 60% -h 50% \
  "tmux list-sessions -F '#S' | fzf --reverse --prompt='session > ' | xargs -r tmux switch-client -t"
bind g display-popup -E -w 90% -h 90% "lazygit"
bind ! break-pane                # pop a pane into its own window

# ── DSA project bindings ─────────────────────────────────────────────────────
bind D display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
  "cd ~/Documents/dsa-content && ./scripts/dsa stats; read"
bind N display-popup -E -w 80% -h 60% \
  "cd ~/Documents/dsa-content && ./scripts/dsa next; read"

# ── status bar: minimal, dark, reads well at 1080p ──────────────────────────
set -g status-position bottom
set -g status-style "bg=#11111b,fg=#a6adc8"
set -g status-left  "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=#11111b,fg=#89b4fa]"
set -g status-left-length 30
set -g status-right "#[fg=#585b70]%a %d %b  #[fg=#89b4fa,bold]%H:%M "
setw -g window-status-format         " #I #W "
setw -g window-status-current-format "#[bg=#313244,fg=#f9e2af,bold] #I #W "
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#89b4fa,fg=#11111b,bold"
